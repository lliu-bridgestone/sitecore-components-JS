<!--
// Make sure to change  "open: false",  to  open: true. On the z-data="{}".
//
//Programmatic usage:
//
// window.dispatchEvent(new CustomEvent('open-invite-modal')) // or call $refs.show() inside Alpine
-->
<div
  class="w-full max-w-xl mx-auto"
  x-data="{
      open: true,
      sent: false,
      form: { email:'', role:'viewer' },
      reset(){ this.form = { email:'', role:'viewer' }; this.sent = false; },
      show(){ this.reset(); this.open = true; this.$nextTick(()=> this.$refs.email?.focus()); },
      close(){ this.open = false; },
      submit(){
        if(!this.form.email || !/^[^s@]+@[^s@]+.[^s@]+$/.test(this.form.email)) return;
        this.sent = true;
        setTimeout(()=> this.close(), 1400);
      }
    }"
>
  <button
    class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-background bg-foreground outline outline-foreground hover:opacity-90 focus-visible:outline-border h-9 px-4 text-sm mx-auto"
    type="button"
    @click="show()"
  >
    Invite teammate
  </button>
  <!-- Backdrop -->
  <div
    x-show="open"
    x-transition.opacity
    class="fixed inset-0 z-40 bg-background/20"
    @click="close()"
    aria-hidden="true"
  ></div>
  <!-- Dialog -->
  <div
    x-show="open"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="invite-title"
    @keydown.escape.window.prevent="close()"
  >
    <div
      x-show="open"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="translate-y-4 sm:translate-y-0 sm:scale-95"
      x-transition:enter-end="translate-y-0 sm:scale-100"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      @click.outside="close()"
      class="w-full sm:max-w-lg rounded-xl bg-background shadow-lg outline outline-1 outline-border/5 -outline-offset-1 outline-border/10 p-4 sm:p-6"
    >
      <!-- Header -->
      <div class="flex items-start gap-3">
        <div
          class="shrink-0 size-10 rounded-full grid place-items-center bg-muted text-foreground"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler-layout-users-group size-4"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M10 13a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path>
            <path d="M8 21v-1a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v1"></path>
            <path d="M15 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path>
            <path d="M17 10h2a2 2 0 0 1 2 2v1"></path>
            <path d="M5 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path>
            <path d="M3 13v-1a2 2 0 0 1 2 -2h2"></path>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <h2 class="text-sm font-semibold text-foreground" id="invite-title">
            Invite teammate
          </h2>
          <p class="text-xs text-xs text-muted-foreground">
            Send an invite by email and choose a role.
          </p>
        </div>
        <button
          class="flex items-center justify-center text-center shadow-subtle font-medium duration-500 ease-in-out transition-colors focus:outline-2 focus:outline-offset-2 text-muted-foreground bg-background outline outline-border hover:text-foreground hover:bg-muted focus:outline-border text-foreground bg-muted outline-border hover:bg-muted focus:outline-border size-7 p-0.5 text-xs rounded-md"
          aria-label="Close"
          @click="close()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler-wave-x size-4"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M18 6l-12 12"></path>
            <path d="M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <!-- Body: form / success -->
      <div class="mt-4" x-show="!sent">
        <label class="block text-xs font-medium text-foreground">Email</label>
        <input
          x-ref="email"
          x-model="form.email"
          type="email"
          placeholder="name@company.com"
          class="mt-1 block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"
        />
        <label class="block mt-3 text-xs font-medium text-foreground"
          >Role</label
        >
        <div class="mt-1 flex gap-2">
          <button
            type="button"
            @click="form.role='viewer'"
            :class="form.role==='viewer' ? 'bg-background : 'outline outline outline-border text-muted-foreground'"
            class="h-8 px-2 rounded-md text-xs font-medium"
          >
            Viewer
          </button>
          <button
            type="button"
            @click="form.role='editor'"
            :class="form.role==='editor' ? 'bg-background : 'outline outline outline-border text-muted-foreground'"
            class="h-8 px-2 rounded-md text-xs font-medium"
          >
            Editor
          </button>
          <button
            type="button"
            @click="form.role='admin'"
            :class="form.role==='admin' ? 'bg-background : 'outline outline outline-border text-muted-foreground'"
            class="h-8 px-2 rounded-md text-xs font-medium"
          >
            Admin
          </button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3">
          <div>
            <label class="block text-xs font-medium text-foreground"
              >Department</label
            >
            <select
              class="mt-1 block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"
            >
              <option>General</option>
              <option>Engineering</option>
              <option>Design</option>
              <option>Marketing</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-foreground"
              >Expires</label
            >
            <select
              class="mt-1 block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"
            >
              <option>7 days</option>
              <option>30 days</option>
              <option>Never</option>
            </select>
          </div>
        </div>
      </div>
      <div class="mt-4 flex items-center gap-2" x-show="!sent">
        <button
          class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-8 px-3.5 text-xs"
          type="button"
          :disabled="!form.email"
          @click="submit()"
        >
          Send invite
        </button>
        <button
          class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-8 px-3.5 text-xs"
          type="button"
          @click="navigator.clipboard.writeText(window.location.origin + '/invite?role=' + form.role)"
        >
          Copy invite link
        </button>
        <button
          class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-destructive-foreground bg-destructive outline outline-destructive hover:opacity-90 focus-visible:outline-border h-8 px-3.5 text-xs"
          type="button"
          @click="close()"
        >
          Cancel
        </button>
      </div>
      <!-- Success state -->
      <div class="mt-2" x-show="sent" x-transition.opacity>
        <div class="flex items-center gap-2 text-success">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler-circle-check size-4"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M5 12l5 5l10 -10"></path>
          </svg>
          <p class="text-sm">
            Invitation sent to
            <span class="font-medium" x-text="form.email"></span>.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
